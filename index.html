<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gym Buddy</title>
  
  <!-- Tailwind CSS & Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            navy: {
              900: '#1C1C28', // Deep Navy Background
              800: '#252536', // Cards
              700: '#323248', // Borders & Inputs
              600: '#40405A', // Hovers
            },
            cyan: {
              400: '#3BD1D9',
              500: '#1EC1CB', // Primary Cyan
              600: '#189A9F',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-navy-900 text-white antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Mobile App Shell -->
  <div class="app-shell mx-auto w-full max-w-[430px] min-h-[100dvh] bg-navy-900 flex flex-col relative shadow-2xl border-x border-navy-900">

    <!-- Compact Mobile Header (Centered) -->
    <header class="sticky top-0 z-30 bg-navy-800/90 backdrop-blur-xl border-b border-navy-700 px-3.5 h-14 flex items-center justify-center">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full overflow-hidden shadow-sm shrink-0">
          <img src="assets/Gemini_Generated_Image_o5tqqeo5tqqeo5tq.jpg" alt="Gym Buddy Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="font-black text-lg tracking-tight text-white">Gym <span class="text-cyan-500">Buddy</span></h1>
      </div>
    </header>

    <!-- Scrollable Main Area -->
    <main class="flex-1 px-3.5 pt-3.5 pb-20 space-y-4 overflow-x-hidden">

      <!-- ========================================== -->
      <!-- VIEW 1: HOME (TODAY'S WORKOUT)             -->
      <!-- ========================================== -->
      <div id="viewHome" class="space-y-3.5">
        <div id="homeStateContainer" class="space-y-3">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- ========================================== -->
      <!-- VIEW 2: ROUTINES (CYCLE BUILDER)           -->
      <!-- ========================================== -->
      <div id="viewRoutines" class="hidden space-y-3.5">
        <div class="glass-card rounded-2xl p-3.5 bg-navy-800 border border-navy-700 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <span id="lblRoutineTag" class="text-[10px] font-bold uppercase tracking-widest text-cyan-500">Cycle Builder</span>
              <h2 id="lblRoutineHeader" class="text-base font-black text-white mt-0.5">Your Routines</h2>
            </div>
            <button onclick="openWorkoutModal(null, true)" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500 text-navy-900 shadow-md shadow-cyan-500/20 hover:bg-cyan-400 transition-colors">
              + New
            </button>
          </div>
        </div>

        <section id="routinesContainer" class="space-y-3"></section>
      </div>

      <!-- ========================================== -->
      <!-- VIEW 3: MONTH (CALENDAR & HISTORY)         -->
      <!-- ========================================== -->
      <div id="viewMonth" class="hidden space-y-3.5">
        <!-- 2 Compact Stats Cards Side-by-Side -->
        <section class="grid grid-cols-2 gap-2.5">
          <div class="glass-card rounded-2xl p-3 bg-navy-800 border border-navy-700 shadow-sm">
            <div class="flex items-center justify-between text-gray-400 text-[11px] font-semibold mb-1">
              <span id="lblStatWorkouts">Workouts</span>
              <i data-lucide="flame" class="w-3.5 h-3.5 text-cyan-500"></i>
            </div>
            <div id="statTotalWorkouts" class="text-2xl font-black text-white leading-tight">0</div>
            <p id="lblStatWorkoutsSub" class="text-[10px] text-gray-500 mt-0.5 truncate">Logged sessions</p>
          </div>

          <div class="glass-card rounded-2xl p-3 bg-navy-800 border border-navy-700 shadow-sm">
            <div class="flex items-center justify-between text-gray-400 text-[11px] font-semibold mb-1">
              <span id="lblStatVolume">Total Volume</span>
              <i data-lucide="bar-chart-3" class="w-3.5 h-3.5 text-cyan-500"></i>
            </div>
            <div id="statTotalVolume" class="text-2xl font-black text-white leading-tight">0 <span class="text-xs font-bold text-gray-500">kg</span></div>
            <p id="lblStatVolumeSub" class="text-[10px] text-gray-500 mt-0.5 truncate">Completed Sets × Reps × kg</p>
          </div>
        </section>

        <!-- Compact Attendance & Volume Card -->
        <div class="glass-card rounded-2xl p-3.5 bg-navy-800 border border-navy-700 shadow-sm">
          <div class="flex items-center justify-between">
            <div>
              <div id="lblGymAttendance" class="text-[11px] text-gray-400 font-semibold">Gym Attendance</div>
              <div class="flex items-baseline gap-1.5 mt-0.5">
                <span id="monthDaysCount" class="text-3xl font-black text-white leading-none">0</span>
                <span id="lblDaysThisMonth" class="text-[11px] font-bold text-gray-500">days this month</span>
              </div>
            </div>
            <div class="text-right">
              <div id="lblMonthVolume" class="text-[10px] text-gray-400 font-bold uppercase">Monthly Volume</div>
              <div id="monthVolumeStat" class="text-base font-black text-cyan-500 mt-0.5">0 kg</div>
            </div>
          </div>
        </div>

        <!-- Calendar Card -->
        <div class="glass-card rounded-2xl p-3.5 bg-navy-800 border border-navy-700 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <div>
              <span id="lblMonthTrackerTag" class="text-[9px] font-bold uppercase tracking-widest text-cyan-500 block">Calendar</span>
              <h2 id="calMonthTitle" class="text-base font-black text-white">November 2026</h2>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="changeCalendarMonth(-1)" class="p-1.5 rounded-lg bg-navy-700 active:bg-navy-600 border border-navy-600 text-gray-300">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <button id="lblTodayBtn" onclick="goToCurrentMonth()" class="px-2.5 py-1 rounded-lg bg-navy-700 active:bg-navy-600 border border-navy-600 text-[11px] font-bold text-gray-300">
                Today
              </button>
              <button onclick="changeCalendarMonth(1)" class="p-1.5 rounded-lg bg-navy-700 active:bg-navy-600 border border-navy-600 text-gray-300">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Days of Week Header -->
          <div id="calWeekdaysHeader" class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-bold text-gray-400 uppercase mb-1.5"></div>

          <!-- Calendar Days Grid -->
          <div id="calendarGrid" class="grid grid-cols-7 gap-1.5"></div>
        </div>

        <!-- Selected Day Details Box -->
        <div id="selectedDayCard" class="glass-card rounded-2xl p-3.5 bg-navy-800 border border-navy-700 shadow-sm"></div>

      </div>

    </main>

    <!-- iPhone Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-30 bg-navy-800/95 backdrop-blur-xl border-t border-navy-700 px-3 py-2 flex items-center justify-around safe-bottom shadow-[0_-4px_10px_-1px_rgb(0,0,0,0.3)]">
      <button
        id="tabBtnHome"
        onclick="switchView('home')"
        class="flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-cyan-500 transition"
      >
        <i data-lucide="zap" class="w-5 h-5"></i>
        <span id="lblTabHome" class="text-[10px] font-extrabold">Today</span>
      </button>

      <button
        id="tabBtnRoutines"
        onclick="switchView('routines')"
        class="flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-gray-500 transition hover:text-gray-300"
      >
        <i data-lucide="layout-template" class="w-5 h-5"></i>
        <span id="lblTabRoutines" class="text-[10px] font-bold">Routines</span>
      </button>

      <button
        id="tabBtnMonth"
        onclick="switchView('month')"
        class="flex flex-col items-center gap-0.5 py-1 px-3 rounded-xl text-gray-500 transition hover:text-gray-300"
      >
        <i data-lucide="calendar-days" class="w-5 h-5"></i>
        <span id="lblTabMonth" class="text-[10px] font-bold">History</span>
      </button>
    </nav>

  </div>

  <!-- Mobile Bottom-Sheet Modal: Add / Edit Routine -->
  <div id="workoutModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/70 backdrop-blur-sm">
    <div class="bg-navy-800 border-t border-navy-700 rounded-t-3xl w-full max-w-[430px] max-h-[92dvh] flex flex-col shadow-2xl overflow-hidden animate-slide-up">
      
      <div class="px-4 py-3.5 border-b border-navy-700 flex items-center justify-between">
        <div>
          <h2 id="modalTitle" class="text-base font-extrabold text-white">Routine</h2>
          <p id="modalSubtitle" class="text-[11px] text-gray-400">Type your exercises and number of sets</p>
        </div>
        <button onclick="closeWorkoutModal()" class="p-1.5 rounded-xl text-gray-400 bg-navy-700 hover:bg-navy-600 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="workoutForm" onsubmit="saveModalData(event)" class="p-4 overflow-y-auto space-y-3.5 flex-1">
        <input type="hidden" id="editModalId">
        <input type="hidden" id="isRoutineMode"> 

        <div class="space-y-2.5">
          <div>
            <label id="lblWorkoutTitle" class="block text-[11px] font-bold text-gray-400 mb-1">Title</label>
            <input
              type="text"
              id="workoutTitle"
              required
              placeholder="e.g. Push Day"
              class="mobile-input w-full px-3 py-2 bg-navy-900 border border-navy-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-500 transition-colors"
            >
          </div>
          <div id="dateFieldContainer">
            <label id="lblWorkoutDate" class="block text-[11px] font-bold text-gray-400 mb-1">Date</label>
            <input
              type="date"
              id="workoutDate"
              class="mobile-input w-full px-3 py-2 bg-navy-900 border border-navy-700 rounded-xl text-white focus:outline-none focus:border-cyan-500 transition-colors"
            >
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label id="lblExercisesHeader" class="text-[11px] font-bold text-gray-400">Exercises</label>
            <button
              type="button"
              onclick="addExerciseRow()"
              class="text-xs font-extrabold text-cyan-500 flex items-center gap-1 hover:text-cyan-400 transition-colors"
            >
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span id="lblAddExerciseBtn">+ Add</span>
            </button>
          </div>

          <div id="exerciseRowsContainer" class="space-y-2.5"></div>
        </div>

        <div class="pt-3 border-t border-navy-700 grid grid-cols-2 gap-2.5 safe-bottom">
          <button
            type="button"
            id="lblCancelBtn"
            onclick="closeWorkoutModal()"
            class="py-2.5 rounded-xl text-xs font-bold text-gray-300 bg-navy-700 border border-navy-600 hover:bg-navy-600 transition-colors"
          >
            Cancel
          </button>
          <button
            type="submit"
            id="lblSaveBtn"
            class="py-2.5 rounded-xl text-xs font-extrabold bg-cyan-500 text-navy-900 shadow-md shadow-cyan-500/20 hover:bg-cyan-400 transition-colors"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
